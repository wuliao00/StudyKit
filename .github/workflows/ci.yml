name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: Lint / Unit Test / Debug Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # debug 包必须跨构建同签名，否则用户换包只能卸载重装（= 学习数据全丢）。
      # 详见 app/build.gradle.kts 里 sharedDebug 那段注释：这里负责把 secret 落成文件，
      # 再把路径与"必须用到它"的开关交给构建。
      - name: Restore pinned debug keystore
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${DEBUG_KEYSTORE_B64:-}" ]; then
            echo "::error::secret DEBUG_KEYSTORE_B64 是空的。宁可构建失败，也不要静默签出一个"
            echo "   随机 debug keystore —— 那会让下一次覆盖安装报 INSTALL_FAILED_UPDATE_INCOMPATIBLE"
            echo "   （fork 的 PR 拿不到 secret，属于预期失败，直接 push 分支再出包）"
            exit 1
          fi
          ks="${RUNNER_TEMP}/studykit-debug.keystore"
          printf '%s' "${DEBUG_KEYSTORE_B64}" | base64 -d > "${ks}"
          echo "STUDYKIT_DEBUG_KEYSTORE=${ks}" >> "${GITHUB_ENV}"
          echo "REQUIRE_DEBUG_KEYSTORE=true" >> "${GITHUB_ENV}"
          echo "keystore bytes: $(wc -c < "${ks}")"

      - name: Lint, unit tests and debug build
        run: ./gradlew lint testDebugUnitTest assembleDebug

      # 上一轮 CI 全绿、包也装不上 —— 因为"签名对不对"这件事没有任何地方在断言。
      # 这里把产物 APK 的签名证书和 keystore 里的证书对一次，不一致就红。
      - name: Assert APK is signed with the pinned debug key
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          ks="${STUDYKIT_DEBUG_KEYSTORE:?STUDYKIT_DEBUG_KEYSTORE 未设置}"
          # 指纹有两种写法：keytool 用冒号分组（FD:4C:...），apksigner 用裸 64 位十六进制。
          # 两边都归一成"大写无冒号 64 位"再比。
          # 注意别用 `tr -d ' :'` + `[0-9A-F]{64}` 一把梭：keytool 那行标签是
          # "SHA256: FD:4C:..."，去掉冒号后 "A256" 本身是合法十六进制，
          # 正则会从标签里开始匹配、把真指纹的头 4 位吃掉（第一轮就是这么红的）。
          hex64='([0-9A-Fa-f]{2}:){31}[0-9A-Fa-f]{2}|[0-9A-Fa-f]{64}'
          want="$(keytool -list -v -keystore "${ks}" -storepass android -alias androiddebugkey \
            | grep -oE "${hex64}" | head -n1 | tr -d ':' | tr 'a-f' 'A-F')"
          apksigner="$(find "${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/opt/android-sdk}}/build-tools" \
            -name apksigner -type f 2>/dev/null | sort | tail -n1)"
          if [ -z "${apksigner}" ]; then
            echo "::error::runner 上找不到 apksigner，无法核对签名（宁可红，不要跳过这一关）"
            exit 1
          fi
          got="$("${apksigner}" verify --print-certs "${apk}" \
            | grep 'certificate SHA-256 digest' | grep -oE "${hex64}" | head -n1 | tr -d ':' | tr 'a-f' 'A-F')"
          echo "keystore cert = ${want}"
          echo "APK cert      = ${got}"
          if [ -z "${want}" ] || [ "${want}" != "${got}" ]; then
            echo "::error::debug APK 的签名证书与固定 keystore 不一致（或解析失败）——" \
                 "换包会报 INSTALL_FAILED_UPDATE_INCOMPATIBLE，用户只能卸载重装丢数据"
            exit 1
          fi
          echo "✅ debug 包签名与固定 keystore 一致，后续 CI 产物可互相覆盖安装" | tee -a "${GITHUB_STEP_SUMMARY}"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: StudyKit-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  # 只做两件事：证明 release（R8 混淆 + 资源收缩）编得起来，以及 baseline profile
  # 真的被编进了产物。仓库内没有 signingConfig，AGP 产出 app-release-unsigned.apk，
  # 本 job 不签名、不引入任何密钥、不上传 release 产物（未签名的包上传没有意义）。
  release-build:
    name: Release Build (unsigned) / Baseline Profile Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble unsigned release
        run: ./gradlew --no-daemon assembleRelease

      - name: Assert baseline profile is packaged in the release APK
        run: |
          set -euo pipefail
          if ! ls app/build/outputs/apk/release/*.apk >/dev/null 2>&1; then
            echo "::error::release 构建没有产出任何 APK（app/build/outputs/apk/release/ 为空）"
            exit 1
          fi
          apk="$(ls app/build/outputs/apk/release/*.apk | head -n 1)"
          echo "检查产物：${apk}"
          # 用 unzip -l 而非 apktool：ubuntu runner 自带 unzip，不额外引入依赖。
          listing="${RUNNER_TEMP}/apk-contents.txt"
          unzip -l "${apk}" | tee "${listing}"
          # AGP 把 src/main/baseline-prof.txt 编成 ART 二进制 profile 放进 assets/dexopt/，
          # 具体文件名随 AGP 版本而变（baseline.prof / baseline.prof00 / baseline.profm 等），
          # 故按前缀匹配，不把字面量写死。
          matched="$(grep -E 'assets/dexopt/baseline\.prof' "${listing}" || true)"
          if [ -z "${matched}" ]; then
            echo "::error::APK 里没有 assets/dexopt/baseline.prof*：baseline profile 未被打进产物（规则被静默丢弃或 art-profile 任务未参与构建）"
            exit 1
          fi
          echo "匹配到的 profile 条目："
          printf '%s\n' "${matched}"
          # 只要有一条非 0 字节即算编入（同名多条目时不能被第一个空条目误判）。
          entry="$(printf '%s\n' "${matched}" | awk '$1 + 0 > 0 { print; exit }')"
          if [ -z "${entry}" ]; then
            echo "::error::baseline profile 产物全为 0 字节：规则一条都没编进去"
            exit 1
          fi
          echo "✅ baseline profile 已编入 ${apk} → ${entry}" | tee -a "${GITHUB_STEP_SUMMARY}"
